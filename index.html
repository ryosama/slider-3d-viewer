<script>/* Shared parsing utilities. No network access or executable Markdown. */
(function (root) {
  'use strict';
  const defaults = {
    theme: {
      'slide-border-width': '1px', 'slide-border-color': '#3c424b',
      'slide-border-radius': '18px', 'slide-background-color': '#171a20',
      'slide-transparency': '10%', 'background-color': '#000', 'text-color': '#fff',
      'font-face': 'Arial, sans-serif', 'breadcrumb-style': 'dotted', 'breadcrumb-color': '#ef5350',
    },
    transition: {
      'when-slide-to-previous': 'zoom-out-zoom-in', 'when-slide-to-next': 'follow-breadcrumb',
      'when-slide-to-another': 'zoom-out-zoom-in', 'follow-breadcrumb-speed': '1',
      'zoom-out-ratio': '1.7', 'zoom-out-speed': '1', 'zoom-in-speed': '1',
    },
  };
  function parseConfig(text) {
    const config = { order: [], theme: { ...defaults.theme }, transition: { ...defaults.transition } };
    let section = '';
    for (const line of text.replace(/^\uFEFF/, '').split(/\r?\n/)) {
      const heading = line.match(/^#{1,6}\s+(order|theme|transition)\s*$/i);
      if (heading) { section = heading[1].toLowerCase(); continue; }
      if (/^#/.test(line)) { section = ''; continue; }
      const item = line.match(/^\s*-\s+(.+?)\s*$/);
      if (!item) continue;
      if (section === 'order') config.order.push(item[1].replace(/^`|`$/g, ''));
      else if (section === 'theme' || section === 'transition') {
        const pair = item[1].match(/^([a-z-]+)\s*:\s*(.+)$/);
        if (pair && Object.hasOwn(defaults[section], pair[1])) config[section][pair[1]] = pair[2];
      }
    }
    if (!['dotted', 'dashed', 'plain', 'none'].includes(config.theme['breadcrumb-style'])) config.theme['breadcrumb-style'] = 'dotted';
    for (const key of ['when-slide-to-previous', 'when-slide-to-next', 'when-slide-to-another']) {
      if (!['zoom-out-zoom-in', 'follow-breadcrumb'].includes(config.transition[key])) config.transition[key] = defaults.transition[key];
    }
    return config;
  }
  function number(value, fallback, min = .1, max = 10) {
    const parsed = Number(value);
    return Number.isFinite(parsed) ? Math.max(min, Math.min(max, parsed)) : fallback;
  }
  function normalize(path) {
    const parts = [];
    for (const part of path.replace(/\\/g, '/').split('/')) {
      if (part === '..') parts.pop();
      else if (part && part !== '.') parts.push(part);
    }
    return parts.join('/');
  }
  function resolve(base, path) {
    return normalize(base.slice(0, base.lastIndexOf('/') + 1) + path);
  }
  const escape = value => String(value).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  const safeExternal = value => /^https?:\/\//i.test(value);
  function inline(text, context) {
    const token = /(!?\[([^\]]*)\]\(([^\s)]+)\)|`([^`]+)`|\*\*([^*]+)\*\*|\*([^*]+)\*)/g;
    let result = '', last = 0, match;
    while ((match = token.exec(text))) {
      result += escape(text.slice(last, match.index));
      if (match[4] !== undefined) result += `<code>${escape(match[4])}</code>`;
      else if (match[5] !== undefined) result += `<strong>${escape(match[5])}</strong>`;
      else if (match[6] !== undefined) result += `<em>${escape(match[6])}</em>`;
      else {
        const label = escape(match[2]);
        let url;
        try { url = decodeURI(match[3]); } catch { url = match[3]; }
        if (match[1].startsWith('!')) {
          const source = context.image(url);
          result += source ? `<img src="${escape(source)}" alt="${label}" loading="eager">` : `<span class="missing-image">[Image introuvable : ${label}]</span>`;
        } else if (safeExternal(url)) result += `<a href="${escape(url)}" target="_blank" rel="noopener noreferrer">${label} ↗</a>`;
        else if (/^mailto:/i.test(url)) result += `<a href="${escape(url)}">${label}</a>`;
        else if (!/^[a-z][a-z\d+.-]*:/i.test(url) && !url.startsWith('//')) result += `<a href="#" data-slide-link="${escape(url)}">${label}</a>`;
        else result += label;
      }
      last = token.lastIndex;
    }
    return result + escape(text.slice(last));
  }
  function markdown(text, context = { image: () => null }) {
    const lines = text.replace(/\r/g, '').split('\n');
    let html = '', paragraph = [], list = '', code = null;
    function flush() { if (paragraph.length) { html += `<p>${inline(paragraph.join(' '), context)}</p>`; paragraph = []; } }
    function endList() { if (list) { html += `</${list}>`; list = ''; } }
    for (const line of lines) {
      if (/^\s*```/.test(line)) {
        flush(); endList();
        if (code !== null) { html += `<pre><code>${escape(code.join('\n'))}</code></pre>`; code = null; } else code = [];
        continue;
      }
      if (code !== null) { code.push(line); continue; }
      const heading = line.match(/^(#{1,6})\s+(.+)$/);
      const item = line.match(/^\s*(?:([-*])|\d+\.)\s+(.+)$/);
      if (heading) { flush(); endList(); html += `<h${heading[1].length}>${inline(heading[2], context)}</h${heading[1].length}>`; }
      else if (item) { flush(); const type = item[1] ? 'ul' : 'ol'; if (list !== type) { endList(); list = type; html += `<${list}>`; } html += `<li>${inline(item[2], context)}</li>`; }
      else if (/^>\s?/.test(line)) { flush(); endList(); html += `<blockquote>${inline(line.replace(/^>\s?/, ''), context)}</blockquote>`; }
      else if (/^\s*(---|\*\*\*)\s*$/.test(line)) { flush(); endList(); html += '<hr>'; }
      else if (!line.trim()) { flush(); endList(); }
      else { endList(); paragraph.push(line.trim()); }
    }
    flush(); endList();
    if (code !== null) html += `<pre><code>${escape(code.join('\n'))}</code></pre>`;
    return html;
  }
  function title(text, fallback) { return text.match(/^#\s+(.+)$/m)?.[1] || fallback.replace(/\.md$/i, ''); }
  const api = { defaults, parseConfig, number, normalize, resolve, escape, safeExternal, markdown, title };
  if (typeof module !== 'undefined' && module.exports) module.exports = api;
  else root.Orbite = api;
})(typeof window === 'undefined' ? globalThis : window);
</script>
<script>window.ORBITE_DEMO = {"label":"Démo intégrée","config":"# Configuration de la présentation\n\n## order\n- slides/kde.md\n- slides/gnome.md\n- slides/xfce.md\n- slides/cinnamon.md\n- slides/mate.md\n- slides/lxqt.md\n- slides/enlightenment.md\n- slides/afterstep.md\n- slides/windowmaker.md\n- slides/i3.md\n\n## theme\n- slide-border-width: 1px\n- slide-border-color: #3c424b\n- slide-border-radius: 18px\n- slide-background-color: #171a20\n- slide-transparency: 10%\n- background-color: #000000\n- text-color: #ffffff\n- font-face: Arial, sans-serif\n- breadcrumb-style: dotted\n- breadcrumb-color: #ef5350\n\n## transition\n- when-slide-to-previous: zoom-out-zoom-in\n- when-slide-to-next: follow-breadcrumb\n- when-slide-to-another: zoom-out-zoom-in\n- follow-breadcrumb-speed: 1\n- zoom-out-ratio: 2\n- zoom-out-speed: 1\n- zoom-in-speed: 1\n","slides":[{"path":"slides/kde.md","text":"# KDE Plasma\n\n![Illustration originale du bureau KDE Plasma](../assets/kde.svg)\n\n**La liberté du détail.**\n\nUn bureau qui se façonne autour de vos habitudes. Plasma propose des panneaux, des composants graphiques et de nombreux réglages.\n\n- Des panneaux et des widgets personnalisables\n- Un lanceur pour retrouver applications et documents\n- Un écosystème riche d’applications KDE\n\n[Site du projet](https://kde.org/plasma-desktop/) · [Comparer avec Xfce](xfce.md)\n","title":"KDE Plasma"},{"path":"slides/gnome.md","text":"# GNOME\n\n![Illustration originale du bureau GNOME](../assets/gnome.svg)\n\n**Faire place à l’essentiel.**\n\nLa vue Activités rassemble les fenêtres, les applications et les espaces de travail dans une interface cohérente.\n\n- Une vue d’ensemble des activités\n- Des espaces de travail pour organiser ses tâches\n- Une navigation pensée aussi pour le clavier\n\n[Site du projet](https://www.gnome.org/) · [Retrouver KDE Plasma](kde.md)\n","title":"GNOME"},{"path":"slides/xfce.md","text":"# Xfce\n\n![Illustration originale du bureau Xfce](../assets/xfce.svg)\n\n**Léger dans ses gestes.**\n\nXfce privilégie la modularité et une consommation de ressources mesurée, avec une organisation de bureau traditionnelle.\n\n- Des composants utilisables séparément\n- Des panneaux et des espaces de travail\n- Thunar pour parcourir ses fichiers\n\n[Site du projet](https://xfce.org/about) · [Explorer un autre bureau léger](lxqt.md)\n","title":"Xfce"},{"path":"slides/cinnamon.md","text":"# Cinnamon\n\n![Illustration originale du bureau Cinnamon](../assets/cinnamon.svg)\n\n**Un bureau familier.**\n\nDéveloppé par le projet Linux Mint, Cinnamon propose une interface de bureau avec menu, panneau et fenêtres.\n\n- Un menu d’applications et un panneau\n- Des réglages regroupés dans une interface graphique\n- Des applets pour personnaliser le bureau\n\n[Site du projet](https://github.com/linuxmint/cinnamon) · [Découvrir MATE](mate.md)\n","title":"Cinnamon"},{"path":"slides/mate.md","text":"# MATE\n\n![Illustration originale du bureau MATE](../assets/mate.svg)\n\n**La continuité, simplement.**\n\nMATE prolonge l’expérience de GNOME 2 et conserve les repères d’un bureau traditionnel.\n\n- Des menus et des panneaux familiers\n- Une organisation classique des fenêtres\n- Un environnement pour Linux et les systèmes Unix\n\n[Site du projet](https://mate-desktop.org/) · [Comparer avec GNOME](gnome.md)\n","title":"MATE"},{"path":"slides/lxqt.md","text":"# LXQt\n\n![Illustration originale du bureau LXQt](../assets/lxqt.svg)\n\n**Le bureau à l’essentiel.**\n\nLXQt est un environnement de bureau léger et modulaire construit avec Qt.\n\n- Une organisation en composants\n- Un panneau et un menu d’applications\n- Une interface fondée sur Qt\n\n[Site du projet](https://lxqt-project.org/) · [Comparer avec Xfce](xfce.md)\n","title":"LXQt"},{"path":"slides/enlightenment.md","text":"# Enlightenment\n\n![Illustration originale du bureau Enlightenment](../assets/enlightenment.svg)\n\n**Un autre regard.**\n\nEnlightenment associe un gestionnaire de fenêtres, un compositeur et un bureau minimal avec une identité visuelle singulière.\n\n- Une interface personnalisable\n- Les bibliothèques EFL au cœur du projet\n- Un bureau qui explore les effets visuels\n\n[Site du projet](https://www.enlightenment.org/) · [Explorer les bureaux singuliers](afterstep.md)\n","title":"Enlightenment"},{"path":"slides/afterstep.md","text":"# AfterStep\n\n![Illustration originale du bureau AfterStep](../assets/afterstep.svg)\n\n**Le goût des origines.**\n\nUn gestionnaire de fenêtres pour explorer une autre façon d’organiser son écran et découvrir la diversité des interfaces Linux.\n\n- Un univers visuel inspiré de NeXTSTEP\n- Une organisation modulaire du bureau\n- Un terrain de découverte pour les curieux\n\n[Site du projet](http://www.afterstep.org/) · [Découvrir aussi Window Maker](windowmaker.md)\n","title":"AfterStep"},{"path":"slides/windowmaker.md","text":"# Window Maker\n\n![Illustration originale du bureau Window Maker](../assets/windowmaker.svg)\n\n**Des fenêtres, du caractère.**\n\nWindow Maker est un gestionnaire de fenêtres X11 dont l’interface s’inspire de NeXTSTEP.\n\n- Un dock et de petites applications dockables\n- Des raccourcis clavier configurables\n- Des menus et une présentation personnalisables\n\n[Site du projet](https://www.windowmaker.org/) · [Revenir à AfterStep](afterstep.md)\n","title":"Window Maker"},{"path":"slides/i3.md","text":"# i3\n\n![Illustration originale du bureau i3](../assets/i3.svg)\n\n**Chaque fenêtre à sa place.**\n\ni3 est un gestionnaire de fenêtres en mosaïque. Les fenêtres s’organisent dans une structure arborescente, pilotable au clavier.\n\n- Une disposition en mosaïque\n- Des espaces de travail et des raccourcis\n- Un fichier de configuration lisible\n\n[Site du projet](https://i3wm.org/) · [Recommencer l’exploration](kde.md)\n","title":"i3"}],"assets":{"assets/afterstep.svg":"data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA0MDAgMjkwIiByb2xlPSJpbWciIGFya   'use strict';
  const C = window.Orbite;
  const $ = id => document.getElementById(id);
  let deck, index = 0, angle = 0, radius = 1000, animation = null, zoom = 0, urls = [];
  let noticeTimer;
  function notice(message) {
    $('notice').textContent = message;
    $('notice').classList.add('visible');
    clearTimeout(noticeTimer);
    noticeTimer = setTimeout(() => $('notice').classList.remove('visible'), 6500);
  }
  function theme(config) {
    const map = { 'slide-border-width': ['--border-width', 'border-width'], 'slide-border-color': ['--border-color', 'color'], 'slide-border-radius': ['--border-radius', 'border-radius'], 'slide-background-color': ['--slide-bg', 'color'], 'background-color': ['--page-bg', 'color'], 'text-color': ['--text', 'color'], 'font-face': ['--font', 'font-family'], 'breadcrumb-color': ['--trail', 'color'] };

  }

  function resize() {
    const scale = Math.min(Math.max(.2, ($('viewport').clientWidth - 34) / 760), $('viewport').clientHeight / 520);
    $('scaler').style.transform = `scale(${scale})`;
  }
  function breadcrumbs() {
    const style = deck.config.theme['breadcrumb-style'];
    if (style === 'none' || deck.slides.length < 2) return;
    const count = deck.slides.length;
    const steps = count * 24;
    for (let j = 0; j < steps; j++) {
      const a = j * 2 * Math.PI / steps, b = (j + 1) * 2 * Math.PI / steps;
      const x = radius * Math.sin(a), z = radius * Math.cos(a);
      const dx = radius * Math.sin(b) - x, dz = radius * Math.cos(b) - z;
      const line = document.createElement('div');
      line.className = 'trail';
      line.style.width = `${Math.hypot(dx, dz) + .6}px`;
      line.style.borderTop = `2px ${style === 'plain' ? 'solid' : style} var(--trail)`;
      line.style.transform = `translate3d(${x}px,238px,${z}px) rotateY(${-Math.atan2(dz, dx)}rad)`;
      $('world').append(line);
    }
    for (let j = 0; j < count; j++) {
      const a = j * 2 * Math.PI / count;
      const dot = document.createElement('div');
      dot.className = 'trail-node';
      dot.style.transform = `translate3d(${radius * Math.sin(a) - 3}px,235px,${radius * Math.cos(a)}px)`;
      $('world').append(dot);
    }
  }
  function showDeck(next, label) {
    if (animation) cancelAnimationFrame(animation);
    animation = null; deck = next; index = 0; angle = 0; zoom = 0;
    radius = Math.max(600, deck.slides.length * 130);
    theme(deck.config.theme);
    $('world').replaceChildren(); $('filmstrip').replaceChildren();
    deck.slides.forEach((slide, i) => {
      const card = document.createElement('article');
      card.className = 'slide'; card.tabIndex = -1;
      card.style.transform = `rotateY(${i * 2 * Math.PI / deck.slides.length}rad) translateZ(${radius}px)`;
      card.setAttribute('aria-label', `${i + 1}. ${slide.title}`);
      const meta = document.createElement('div'); meta.className = 'slide-meta';
      const category = document.createElement('span'); category.textContent = label === 'Démo intégrée' ? 'BUREAUX LIBRES / COLLECTION 01' : 'PRÉSENTATION LOCALE';
      const position = document.createElement('span'); position.textContent = `${String(i + 1).padStart(2, '0')} — ${String(deck.slides.length).padStart(2, '0')}`;
      meta.append(category, position); card.append(meta);
      const body = document.createElement('div');
      body.innerHTML = C.markdown(slide.text, { image(path) {
        // Relative images remain local. External images are intentionally not fetched.
        if (/^[a-z][a-z\d+.-]*:/i.test(path) || path.startsWith('//')) return null;
        return deck.assets[C.resolve(slide.path, path)] || null;
      } });
      body.addEventListener('click', event => {
        const link = event.target.closest('[data-slide-link]');
        if (!link) return;
        event.preventDefault();
        const target = link.dataset.slideLink.split('#')[0];
        const destination = target ? deck.slides.findIndex(s => s.path === C.resolve(slide.path, target)) : i;
        if (destination < 0) notice(`Diapositive introuvable : ${target}`);
        else go(destination, 'another');
      });
      card.append(body); $('world').append(card);
      const tab = document.createElement('button');
      const num = document.createElement('small'); num.textContent = String(i + 1).padStart(2, '0');
      tab.append(num, document.createTextNode(slide.title));
      tab.addEventListener('click', () => go(i, 'another'));
      $('filmstrip').append(tab);
    });
    breadcrumbs(); camera(); resize(); update();

  }
  function update() {
    const title = deck.slides[index].title;
    $('counter').textContent = `${String(index + 1).padStart(2, '0')} / ${String(deck.slides.length).padStart(2, '0')}`;
    $('current-title').textContent = title;
    $('counter').setAttribute('aria-label', `Diapositive ${index + 1} sur ${deck.slides.length} : ${title}`);
    $('counter').setAttribute('aria-live', 'polite');
    $('previous').disabled = index === 0; $('next').disabled = index === deck.slides.length - 1;
    document.querySelectorAll('.slide').forEach((card, i) => { card.classList.toggle('active', i === index); card.inert = i !== index; card.setAttribute('aria-hidden', String(i !== index)); });

  }
  function go(destination, kind) {
    destination = Math.max(0, Math.min(deck.slides.length - 1, destination));
    if (destination === index) return;
    if (animation) cancelAnimationFrame(animation);
    const from = angle, fromZoom = zoom;
    const to = destination * 2 * Math.PI / deck.slides.length;
    const t = deck.config.transition;
    const style = t[`when-slide-to-${kind}`];

    const inTime = 500 / C.number(t['zoom-in-speed'], 1);

      const elapsed = Math.min(duration, now - start);
      if (style === 'follow-breadcrumb') {
        const p = ease(elapsed / duration); angle = from + (to - from) * p; zoom = fromZoom * (1 - p);
      } else if (elapsed < outTime) { angle = from; zoom = fromZoom + (peak - fromZoom) * ease(elapsed / outTime); }
      else if (elapsed < outTime + travelTime) { angle = from + (to - from) * ease((elapsed - outTime) / travelTime); zoom = peak; }

      if (elapsed < duration) animation = requestAnimationFrame(tick);

  }
  let importVersion = 0;
  async function loadFiles(files, stripRoot) {
    const version = ++importVersion;
    const nextUrls = [];
    try {
      if (!files.length) return;
      const entries = new Map();
      for (const file of files) {
        let path = file.webkitRelativePath || file.name;
        if (stripRoot && path.includes('/')) path = path.slice(path.indexOf('/') + 1);
        path = C.normalize(path);
        if (entries.has(path)) throw new Error(`Nom de fichier en double : ${path}`);
        entries.set(path, file);
      }
      const configFile = entries.get('config.md');
      if (!configFile) throw new Error('Le dossier doit contenir config.md à sa racine.');
      const config = C.parseConfig(await configFile.text());
      if (!config.order.length) throw new Error('La section order de config.md est vide.');
      const unique = new Set();
      const slides = [];
      for (const name of config.order) {
        const path = C.normalize(name);
        if (unique.has(path)) throw new Error(`Diapositive en double dans order : ${path}`);
        unique.add(path);
        if (!/\.md$/i.test(path) || path === 'config.md' || !entries.has(path)) throw new Error(`Diapositive introuvable : ${name}`);
        const text = await entries.get(path).text();
        slides.push({ path, text, title: C.title(text, path) });
      }
      const assets = {};
      for (const [path, file] of entries) {
        if (/\.(png|jpe?g|webp|gif|svg|avif)$/i.test(path)) { const url = URL.createObjectURL(file); nextUrls.push(url); assets[path] = url; }
      }
      if (version !== importVersion) { nextUrls.forEach(URL.revokeObjectURL); return; }
      showDeck({ config, slides, assets }, 'Présentation locale');
      urls.forEach(URL.revokeObjectURL); urls = nextUrls;
      notice(`${slides.length} diapositives chargées. Tout reste sur cet appareil.`);
    } catch (error) { nextUrls.forEach(URL.revokeObjectURL); if (version === importVersion) notice(error.message); }
  }
  function reset() {
    importVersion++;
    showDeck({ ...window.ORBITE_DEMO, config: C.parseConfig(window.ORBITE_DEMO.config) }, window.ORBITE_DEMO.label || 'Démo intégrée');
    urls.forEach(URL.revokeObjectURL); urls = [];
  }
  $('folder').addEventListener('change', event => { loadFiles([...event.target.files], true); event.target.value = ''; });
  $('previous').addEventListener('click', () => go(index - 1, 'previous'));
  $('next').addEventListener('click', () => go(index + 1, 'next'));
  document.addEventListener('keydown', event => {
    if (event.altKey || event.ctrlKey || event.metaKey || /INPUT|TEXTAREA|SELECT/.test(event.target.tagName) || event.target.isContentEditable) return;
    if (event.code === 'Space' && event.target.closest('a,button')) return;
    if (event.key.toLowerCase() === 'o') { event.preventDefault(); $('folder').click(); return; }
    if (event.key === 'ArrowRight' || event.code === 'Space') { event.preventDefault(); go(index + 1, 'next'); }
    else if (event.key === 'ArrowLeft') { event.preventDefault(); go(index - 1, 'previous'); }
    else if (event.key === 'Home') { event.preventDefault(); go(0, 'another'); }
    else if (event.key === 'End') { event.preventDefault(); go(deck.slides.length - 1, 'another'); }
  });
  document.addEventListener('dragover', event => { event.preventDefault(); document.body.classList.add('dragging'); });
  document.addEventListener('dragleave', event => { if (!event.relatedTarget) document.body.classList.remove('dragging'); });
  document.addEventListener('drop', event => { event.preventDefault(); document.body.classList.remove('dragging'); loadFiles([...event.dataTransfer.files], false); });
  let touchX = null;
  $('viewport').addEventListener('touchstart', event => { touchX = event.touches[0].clientX; }, { passive: true });
  $('viewport').addEventListener('touchend', event => { if (touchX === null) return; const delta = event.changedTouches[0].clientX - touchX; touchX = null; if (Math.abs(delta) > 60) go(index + (delta < 0 ? 1 : -1), delta < 0 ? 'next' : 'previous'); }, { passive: true });
  window.addEventListener('resize', resize);
  reset();
})();
</script>
